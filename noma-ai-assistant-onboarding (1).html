    let name = calledIn(t) || (kind === 'space' ? nameCase((t.match(/\bspace for (?:the )?(.+)$/i) || [])[1]) : '');

function quick(pairs) {
  const qr = add(el('div', 'qr enter', pairs.map(([label]) => `<button type="button">${label}</button>`).join('')));
  qr.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || S.busy) return;
    $$('button', qr).forEach(x => x.disabled = true);
    send(pairs[[...qr.children].indexOf(b)][1]);
  });
}

async function flowCap(c, t) {

async function flowRoles(t) {

  const name = personIn(t) || who() || await pickFrom('Whose roles should change?', othersIn(), 'A name'), p = row(name), role = roleIn(t);
  if (!p) return flowMissing(name);

    await trace([['Finding people', name], ['Reading roles', `${p[2].join(', ')} now`]]);
    await say([`**${name}** is ${p[2].join(' and ')} in ${p[1]}. Which role should ${first(name)} have as well?`]);
    quick(roleNames().filter(r => !p[2].includes(r)).map(r => [r, `Give ${name} the ${r} role`]));

  await propose({ title: `Give ${name} the ${role} role`, ic: 'crown', person: name, steps: [{
    label: `Add ${role} to ${name}`, detail: `Keeps ${p[2].join(', ')} · ${p[1]}`, flag: `Changes what ${first(name)} can see and do`,

async function flowMove(t) {

const slash = $('#slash'); let slashItems = [], slashAt = 0;
function updateSlash() {
  if (!input.value.startsWith('/') || S.busy) return hideSlash();
  const q = input.value.slice(1).trim().toLowerCase();
  const caps = visibleCaps();
  const order = q ? caps : [...suggestions(), ...caps.filter(c => !suggestions().includes(c))];
  slashItems = order.filter(c => matches(c, q)).slice(0, 7);
  slashAt = Math.min(slashAt, Math.max(0, slashItems.length - 1));
  slash.innerHTML = `<div class="slash-head"><span>${q ? 'Matches' : 'Suggested first'}</span><span>↑↓ to choose · Enter to use</span></div>` +
    (slashItems.length ? slashItems.map((c, i) => capRow(c, i === slashAt)).join('') : '<p class="cat-empty">Nothing matches. Ask in your own words instead.</p>');
  slash.style.setProperty('--slash-b', `${$('#composer').offsetHeight + 42}px`);
  slash.hidden = false;
}
function hideSlash() { slash.hidden = true; slashItems = []; slashAt = 0; }
slash.addEventListener('mousedown', e => e.preventDefault());
slash.addEventListener('click', e => { const b = e.target.closest('[data-cap]'); if (b) pickCap(b.dataset.cap); });
input.addEventListener('input', () => { slashAt = 0; updateSlash(); });
input.addEventListener('keydown', e => {
  if (slash.hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); input.value = ''; autosize(); syncSend(); hideSlash(); return; }
  if (!slashItems.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); slashAt = (slashAt + (e.key === 'ArrowDown' ? 1 : -1) + slashItems.length) % slashItems.length; updateSlash();
    $('.cap-row.on', slash)?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); pickCap(slashItems[slashAt].id); }
}, true);
input.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== input) hideSlash(); }, 120));

async function setTheme(mode, from = coreEl) {
  const apply = () => { root.dataset.theme = mode; core.theme(mode); paintMarks(); orbitFx.theme(); updateThemeTile(); glassSpecs.forEach(s => s.key = ''); glassSpecs.forEach((_, e) => applyGlass(e)); };
  const c = from.getBoundingClientRect(); const x = c.left + c.width / 2, y = c.top + c.height / 2;
  if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }
  const vt = document.startViewTransition(apply);
  await vt.ready;
  const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
    { duration: 1100, easing: 'cubic-bezier(.16,1,.3,1)', pseudoElement: '::view-transition-new(root)' });
  await vt.finished;
}

/* The orbit: one bead per step on a ring tilted back in space, turning slowly.
   Done beads burn amber, the next one pulses, and a thread of the logo's colours
   runs round the ring as far as you've got. Drawn in 2D with its own perspective:
   points on the far half go on the canvas behind the core, the rest in front. */
const orbitFx = (() => {
  const back = $(".orbit.o-far"), front = $(".orbit.o-near");
  const SIZE = 400, R = 180, TILT = 74 * Math.PI / 180, PERSP = 760, dpr = Math.min(window.devicePixelRatio || 1, 2);
  [back, front].forEach(c => { c.width = SIZE * dpr; c.height = SIZE * dpr; });
  const cb = back.getContext('2d'), cf = front.getContext('2d');
  const CO = [242, 107, 79], AM = [232, 163, 59], TE = [30, 158, 138];
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const arcCol = f => f < .55 ? mix(CO, AM, f / .55) : mix(AM, TE, (f - .55) / .45);

  function readColours() {

    col = { track: cs.getPropertyValue('--o-track').trim(), bead: cs.getPropertyValue('--o-bead').trim(), line: cs.getPropertyValue('--o-bead-line').trim(), dark: root.dataset.theme === 'dark' };
  }
  // Angle 0 is the far side of the ring; the ring turns by `spin`.
  function at(th) {
    const a = th + spin, X = R * Math.sin(a), Y = -R * Math.cos(a);
    const s = PERSP / (PERSP - Y * sinT);
    return { x: SIZE / 2 + X * s, y: SIZE / 2 + Y * cosT * s, s, far: Y < 0 };
  }
  function seg(c, a, b) { c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
  function frame(now) {
    const dt = Math.min((now - (last || now)) / 1000, .05); last = now;
    spin += dt * Math.PI * 2 / 80;
    gp += (gpT - gp) * Math.min(1, dt * 2.2);
    const flash = Math.max(0, 1 - (now - flashAt) / 2200), fl = flash * flash;
    for (const c of [cb, cf]) { c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, SIZE, SIZE); c.lineCap = 'round'; }
    const N = 180, pts = [];
    for (let i = 0; i <= N; i++) pts.push(at(i / N * Math.PI * 2));
    // The track.
    for (const c of [cb, cf]) { c.strokeStyle = col.track; c.shadowBlur = 0; }
    for (let i = 0; i < N; i++) { const a = pts[i], b = pts[i + 1]; const c = a.far ? cb : cf; c.lineWidth = a.s; seg(c, a, b); }
    // The lit arc, as far as the person has got.
    const upto = gp * N;

      } else if (st === 1) {

        c.beginPath(); c.arc(p.x, p.y, r + 2 + k * 12 * p.s, 0, Math.PI * 2); c.stroke();
        c.fillStyle = 'rgba(232,163,59,.28)'; c.beginPath(); c.arc(p.x, p.y, r + 4 * p.s, 0, Math.PI * 2); c.fill();

        const g = c.createRadialGradient(p.x - r * .3, p.y - r * .4, 0, p.x, p.y, r);
        if (col.dark) { g.addColorStop(0, '#fff'); g.addColorStop(1, '#efe5d2'); } else { g.addColorStop(0, '#4a463d'); g.addColorStop(1, '#12110d'); }
        c.fillStyle = g;
      } else {
        c.shadowColor = 'rgba(0,0,0,.18)'; c.shadowBlur = 4; c.fillStyle = col.bead; c.strokeStyle = col.line;

      const age = (now - (pops.get(i) ?? -1e9)) / 1100;

    set(st, p, popIdx) { states = st; gpT = p; if (popIdx >= 0) pops.set(popIdx, performance.now()); start(); },
    show(v) { on = v; start(); },

})();

/* Learning Noma: what things are. */

/* Show me where: a thread of light from the core to the thing, which then glows. */
let spotTimer = 0, spotAt = 0;
function hideSpot() {
  clearTimeout(spotTimer);
  $('#beacon').classList.remove('on'); $('#beacon-tag').classList.remove('on');
  const p = $('#beam-path'); p.getAnimations().forEach(a => a.cancel()); p.style.opacity = 0; $('#beam-head').setAttribute('opacity', 0);
}
async function spotlight(w) {
  hideSpot(); spotAt = Date.now();
  if (w.page && (PAGE.id !== w.page || (w.sec && PAGE.sec !== w.sec))) { go(w.page, w.sec); await wait(80); }
  let t = $(w.target);
  if (!t && w.page) t = $(`[data-page="${w.page}"]`);
  if (!t) return;
  t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); await wait(320);
  const r = t.getBoundingClientRect(), pad = 6;
  const rad = (parseFloat(getComputedStyle(t).borderTopLeftRadius) || 10) + pad;
  Object.assign($('#beacon').style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px`, borderRadius: `${rad}px` });
  // The thread leaves the core, or the header where the core lives when the welcome has scrolled away.
  const c = coreEl.getBoundingClientRect(), panel = ai.getBoundingClientRect(), hs = $('#slot-head').getBoundingClientRect();
  let sx = c.left + c.width / 2, sy = c.top + c.height / 2;
  if (sy < panel.top + 40 || sy > panel.bottom - 40 || !S.open) { sx = hs.left + hs.width / 2; sy = hs.top + hs.height / 2; }
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const ex = clamp(sx, r.left - pad, r.right + pad), ey = clamp(sy, r.top - pad, r.bottom + pad);
  const dx = ex - sx, dy = ey - sy, dist = Math.hypot(dx, dy);
  const lift = dy < -60 ? -Math.min(90, dist * .18) : Math.min(140, dist * .3);
  const path = $('#beam-path'), head = $('#beam-head'), g = $('#beam-g');
  path.setAttribute('d', `M${sx},${sy} C${sx + dx * .25},${sy + dy * .25 - lift} ${sx + dx * .75},${sy + dy * .75 - lift} ${ex},${ey}`);
  g.setAttribute('x1', sx); g.setAttribute('y1', sy); g.setAttribute('x2', ex); g.setAttribute('y2', ey);
  const len = path.getTotalLength();
  path.style.transition = 'none'; path.style.opacity = 1; path.style.strokeDasharray = len;
  path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 760, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
  core.set('thinking');
  const t0 = performance.now();
  await new Promise(done => {
    const step = now => {
      const k = Math.min(1, (now - t0) / 760), e = 1 - Math.pow(1 - k, 4);
      const pt = path.getPointAtLength(len * e); head.setAttribute('cx', pt.x); head.setAttribute('cy', pt.y); head.setAttribute('opacity', 1 - k * .3);
      if (k < 1) requestAnimationFrame(step); else done();
    };
    requestAnimationFrame(step);
  });
  core.set('done');
  $('#beacon').classList.add('on');
  const tag = $('#beacon-tag'); $('span', tag).textContent = w.tag || 'Here';
  const below = r.bottom + pad + 54 < innerHeight;
  tag.style.left = `${clamp(r.left, 12, innerWidth - 292)}px`;
  tag.style.top = below ? `${r.bottom + pad + 10}px` : `${r.top - pad - 46}px`;
  tag.classList.add('on');
  setTimeout(() => { path.style.transition = 'opacity .9s ease'; path.style.opacity = 0; head.setAttribute('opacity', 0); }, 1100);
  spotTimer = setTimeout(hideSpot, 6500);
}
document.addEventListener('pointerdown', e => { if (Date.now() - spotAt > 500 && !e.target.closest('[data-act="show"], .qr')) hideSpot(); }, true);
window.addEventListener('resize', hideSpot);
$('#page').addEventListener('scroll', () => { if (Date.now() - spotAt > 1200) hideSpot(); }, { passive: true });

/* Closing the panel with setup left: the next step waits under the button for a moment. */
let nudgeT = 0;
function showNudge() {
  const nx = obNext(); if (!nx || S.open) return;
  const r = $('#ai-btn').getBoundingClientRect(), n = $('#nudge'), w = 300;
  const left = Math.max(12, Math.min(r.right - w, innerWidth - w - 12));
  n.innerHTML = `<span class="ring" style="--gp:${obDone() / OB.steps.length * 100}%">${obDone()}/${OB.steps.length}</span><div><b>Next: ${nx.label}</b><span>I’m here when you’re ready</span></div><button type="button">Continue</button>`;
  n.style.left = `${left}px`; n.style.top = `${r.bottom + 12}px`; n.style.setProperty('--ax', `${r.left + r.width / 2 - left - 6}px`);
  n.hidden = false; clearTimeout(nudgeT); nudgeT = setTimeout(hideNudge, 9000);
}
function hideNudge() { $('#nudge').hidden = true; clearTimeout(nudgeT); }
$('#nudge').addEventListener('click', e => { if (e.target.closest('button')) setOpen(true); });

/* Every step button, wherever it is: the card on the welcome, a copy in the chat, or "Up next". */
ai.addEventListener('click', e => {
  const host = e.target.closest('.guide, .g-next, .g-mini'); if (!host || !OB) return;
  const btn = e.target.closest('[data-act]'), act = btn?.dataset.act;
  if (act === 'resume') { OB.dismissed = false; if (ACC?.onboarding) delete ACC.onboarding.dismissedAt; refreshOB(); placeCore(true); return; }
  if (act === 'dismiss') { OB.dismissed = true; closeMoment('skip'); refreshOB(); placeCore(true); return; }
  const li = e.target.closest('[data-step]'), s = li && stepById(li.dataset.step); if (!s) return;
  if (!btn) { if (e.target.closest('.g-row') && !s.done) { OB.open = OB.open === s.id || (OB.open == null && s === obNext()) ? '' : s.id; renderGuides(); } return; }
  if (act === 'show') return spotlight(s.where);
  if (S.busy) return;
  if (host.classList.contains('g-next')) host.classList.add('used');
  if (act === 'do') return stepDo(s);
  if (act === 'later') { add(el('p', 'm-quiet enter', 'Okay. It stays in your setup whenever you want it.')); return; }
  if (act === 'explain') {
    const q = s.explainAsk || s.explain, l = LEARN.find(x => x.m.test(q));
    send(q, async () => { if (l) await flowLearn(l); else await flowFallback(); if (!s.done) nextCard(s, 'Ready when you are'); });
  }
});
$('#ai-status').addEventListener('click', () => {
  if (!obActive() || S.busy) return;
  if (!S.started && S.view === 'chat') { scroll.scrollTo({ top: $('#guide-slot').offsetTop - 80, behavior: 'smooth' }); return; }
  send('What should I do next?', flowSetup);
});

/* -------------------------------------------- what moment this is */
// Nobody tells the assistant they are new. It reads the signed-in person's
// record and decides for itself:
//   1. an onboarding record not yet finished or skipped → its steps (owner or teammate);
//   2. else a space joined in the last 7 days and not yet welcomed → that space's welcome;
//   3. else → the normal assistant, with no onboarding at all.
// In Noma the record comes from the auth service: the onboarding row is created
// when a new company's first admin is approved or an invitation is accepted, and
// space_members.joined_at says when someone was added to a space. People who
// existed before have no onboarding row, so they are never treated as new.
const DAY = 864e5, NOW = Date.now();
const ACCOUNTS = {
  nasir_new: { person: 'owner', onboarding: { path: 'owner', startedAt: NOW - 6e4 }, spaces: [{ space: 'BlueBrick HQ', joinedAt: NOW - 6e4 }] },
  sara: { person: 'member', onboarding: { path: 'member', startedAt: NOW - 3e5 }, spaces: [{ space: 'BlueBrick HQ', joinedAt: NOW - 3e5 }] },
  hina: { person: 'space', onboarding: { path: 'member', startedAt: NOW - 700 * DAY, completedAt: NOW - 699 * DAY },
    spaces: [{ space: 'BlueBrick HQ', joinedAt: NOW - 700 * DAY, welcomedAt: NOW - 700 * DAY }, { space: 'Oak Park', joinedAt: NOW - 2 * 36e5 }] },
  nasir: { person: 'done', onboarding: { path: 'owner', startedAt: NOW - 400 * DAY, completedAt: NOW - 399 * DAY },
    spaces: [{ space: 'BlueBrick HQ', joinedAt: NOW - 400 * DAY, welcomedAt: NOW - 400 * DAY }] },
};
function detectMoment(acc) {
  const ob = acc.onboarding;
  if (ob && !ob.completedAt && !ob.dismissedAt) return { kind: ob.path };
  // The space someone arrived with is part of their first day, not a new space.
  const fresh = acc.spaces.find(m => !m.welcomedAt && NOW - m.joinedAt < 7 * DAY && m.joinedAt > (ob?.startedAt ?? -Infinity));
  if (fresh) return { kind: 'space', membership: fresh };
  return { kind: 'none' };
}
// Finishing or skipping writes back to the record, so the moment never comes back.
function closeMoment(how) {
  const m = ACC && MOMENT; if (!m) return;
  if (m.kind === 'space') m.membership.welcomedAt = Date.now();
  else if (ACC.onboarding) ACC.onboarding[how === 'skip' ? 'dismissedAt' : 'completedAt'] = Date.now();
}
let ACC = null, MOMENT = null;
function signIn(id) {
  ACC = ACCOUNTS[id] || ACCOUNTS.nasir_new; MOMENT = detectMoment(ACC);
  const p = ACC.person;
  persona = p; P = PERSONAS[p];
  SPACE = MOMENT.kind === 'space' ? MOMENT.membership.space : (P.space || 'BlueBrick HQ');
  $('#space-name').textContent = SPACE; $('#space-mark').textContent = SPACE[0];
  loadData(p);
  OB = MOMENT.kind === 'none' ? null : makeOB(MOMENT.kind);
  CHANGES = p === 'done' ? PAST_CHANGES.map(c => ({ ...c })) : []; CONVOS = p === 'done' ? PAST_CONVOS : [];
  PAGE = p === 'done' ? { id: 'config', sec: 'users' } : { id: 'home', sec: null };
  const me = $('#me'); me.textContent = P.initial; me.style.background = P.av;
  S.useSel = true; S.awaiting = null;
  renderPage(); renderAiBtn(); renderOrbit();
}

glass($('#ai-glass'), { id: 'g-panel', bevel: 30, scale: 70, blur: 20, sat: 1.7 });
glass($('#composer'), { id: 'g-comp', bevel: 18, scale: 40, blur: 12, sat: 1.8 });
moveThumb();
paintMarks();
// Prototype only: the page signs in as one of the people above, from the address
// (?as=sara, ?as=hina, ?as=nasir; a new company's owner by default).
signIn(new URLSearchParams(location.search).get('as') || 'nasir_new');
renderWelcomeText(); renderGuides(); updateContext();
// When there is a moment, the assistant opens by itself; otherwise it waits to be asked.
if (OB) setTimeout(() => setOpen(true), 500);
