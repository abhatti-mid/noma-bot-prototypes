<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noma AI Getting Started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
 * Noma AI Assistant: Liquid Glass + Cinematic dark, inside Noma as it is.
 * Everything outside the panel copies the app (AppShell, Configuration, Users)
 * with its own tokens, type and logo. The panel docks beside the page, never
 * over it, as AppShell already does. Glass and the lit core are the only new
 * materials, and they belong to the assistant alone.
 */
@property --cx { syntax: '<length>'; inherits: true; initial-value: 220px; }
@property --cy { syntax: '<length>'; inherits: true; initial-value: 180px; }
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@property --orb { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --gp { syntax: '<percentage>'; inherits: true; initial-value: 0%; }

:root {
  --font: 'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
  --display: 'Schibsted Grotesk', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  --mono: var(--font);
  /* The three colours of the noma logo (components/brand.tsx). */
  --coral: #f26b4f; --amber: #e8a33b; --teal: #1e9e8a;
  --ease: cubic-bezier(.16, 1, .3, 1);
}

/* Noma's own tokens (src/index.css): warm paper by day, warm ink at night. */
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #f6f4ef; --panel: #ffffff; --subtle: #efece5; --line: #e6e1d6; --line-soft: #f0ece4;
  --fg: #15140f; --fg-2: #4a463d; --muted: #6b665a; --faint: #cfc8ba;
  --accent: #15140f; --accent-fg: #fff; --accent-hover: #2e2c25; --hover: #efece5; --row-sel: #fbf6ec;
  --attention-fg: #b8401f; --stop: #c8321d;
  --good: #1a7a5e; --good-soft: #e3f4ee; --warn: #8f5a07; --warn-soft: #fdf1dc; --off-soft: #efece5;

  --g-tint: rgba(255, 255, 255, .72);
  --g-comp: rgba(255, 255, 255, .62);
  --g-head: rgba(255, 255, 255, .6);
  --g-pop: rgba(255, 255, 255, .9);
  --g-shadow: 0 30px 70px -34px rgba(21, 20, 15, .3), 0 16px 36px -22px rgba(21, 20, 15, .22);
  --g-inner: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(230, 225, 214, .9), inset 0 -1px 0 rgba(120, 100, 60, .06);
  --rim-base: rgba(255,255,255,1); --rim-low: rgba(207,200,186,.45); --rim-hot: rgba(255,255,255,1);
  --ai-fg: #15140f; --ai-fg-2: #4a463d; --ai-muted: #6b665a; --ai-faint: #a39d90; --ai-line: #ece7dd;
  --bubble: #efece5; --bubble-line: rgba(21,20,15,.04);
  --chip: rgba(246,244,239,.7); --chip-line: #e6e1d6; --chip-hover: #fff;
  --plan: linear-gradient(180deg, #fff, rgba(255,255,255,.86));
  --plan-shadow: 0 16px 36px -22px rgba(21, 20, 15, .35);
  --pool-a: rgba(232,163,59,.16); --pool-b: rgba(30,158,138,.1);
  --cta: #15140f; --cta-fg: #fff; --cta-glow: rgba(21,20,15,.3);
  --node: #fff; --flag: #8f5a07; --flag-bg: #fdf1dc;
  --ok: #1a7a5e; --bad: #a33a1a; --ok-bg: #e3f4ee; --bad-bg: #fdeee9;
  --ti-coral: #b8401f; --ti-coral-bg: #fdeee9; --ti-amber: #8f5a07; --ti-amber-bg: #fdf1dc; --ti-teal: #1a7a5e; --ti-teal-bg: #e3f4ee;
  --grain: .025;
  --o-track: rgba(21,20,15,.14); --o-bead: rgba(255,255,255,.92); --o-bead-line: rgba(21,20,15,.22);
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #121110; --panel: #1b1a17; --subtle: #23211d; --line: #2c2a25; --line-soft: #23211d;
  --fg: #f6f4ef; --fg-2: #d6d0c4; --muted: #9b958a; --faint: #6d685f;
  --accent: #f6f4ef; --accent-fg: #15140f; --accent-hover: #ddd8cd; --hover: #201f1b; --row-sel: rgba(232,163,59,.07);
  --attention-fg: #f79a82; --stop: #d9482b;
  --good: oklch(.84 .13 155); --good-soft: rgba(80,200,150,.12); --warn: oklch(.86 .13 80); --warn-soft: rgba(245,182,79,.12); --off-soft: rgba(255,255,255,.06);
  --ti-coral: #ff9c84; --ti-coral-bg: rgba(242,107,79,.14); --ti-amber: #f2c06a; --ti-amber-bg: rgba(232,163,59,.14); --ti-teal: #5fd0bb; --ti-teal-bg: rgba(30,158,138,.16);

  --g-tint: rgba(14, 13, 11, .6);
  --g-comp: rgba(34, 32, 28, .42);
  --g-head: rgba(14, 13, 11, .45);
  --g-pop: rgba(30, 28, 25, .9);
  --g-shadow: 0 50px 120px -30px rgba(0,0,0,.85), 0 24px 50px -28px rgba(0,0,0,.7);
  --g-inner: inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(255,255,255,.035), inset 0 -1px 0 rgba(0,0,0,.5);
  --rim-base: rgba(255,255,255,.2); --rim-low: rgba(255,255,255,.035); --rim-hot: rgba(255,244,224,.9);
  --ai-fg: #f2ede4; --ai-fg-2: rgba(242,237,228,.76); --ai-muted: rgba(242,237,228,.52); --ai-faint: rgba(242,237,228,.32); --ai-line: rgba(255,255,255,.075);
  --bubble: rgba(255,255,255,.07); --bubble-line: rgba(255,255,255,.08);
  --chip: rgba(255,255,255,.045); --chip-line: rgba(255,255,255,.08); --chip-hover: rgba(255,255,255,.085);
  --plan: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  --plan-shadow: 0 30px 60px -30px rgba(0,0,0,.75);
  --pool-a: rgba(245,182,79,.14); --pool-b: rgba(37,183,160,.1);
  --cta: #f6f4ef; --cta-fg: #15140f; --cta-glow: rgba(255,236,200,.28);
  --node: #1d1c19; --flag: oklch(.86 .13 80); --flag-bg: rgba(245,182,79,.1);
  --ok: oklch(.84 .13 160); --bad: oklch(.8 .13 30); --ok-bg: rgba(37,183,160,.13); --bad-bg: rgba(255,138,107,.12);
  --grain: .05;
  --o-track: rgba(255,255,255,.13); --o-bead: rgba(255,255,255,.08); --o-bead-line: rgba(255,255,255,.3);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* --------------------------------------------- Noma, as components/AppShell.tsx draws it */
.shell { display: flex; flex-direction: column; height: 100%; }
.top { position: relative; z-index: 30; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 32px; background: var(--bg); }
.wordmark { display: flex; align-items: center; gap: 10px; font: 800 22px/1 var(--display); letter-spacing: -.04em; color: var(--fg); flex: none; }
.space-btn { display: flex; align-items: center; gap: 10px; height: 40px; max-width: 256px; padding: 0 10px 0 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-weight: 600; font-size: 14px; box-shadow: 0 1px 2px rgb(21 20 15 / .05); flex: none; }
.space-btn svg { color: var(--muted); }
.mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font: 800 12px var(--display); flex: none; }
.navbar { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.pill { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--fg-2); white-space: nowrap; text-decoration: none; transition: background .2s, color .2s; }
.pill:hover { background: var(--subtle); color: var(--fg); }
.pill.on { background: var(--accent); color: var(--accent-fg); }
.pill .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--attention-fg); }
.pill svg { width: 15px; height: 15px; }
.pill .soft { font-weight: 400; opacity: .75; }
.navbar .gear { margin-left: auto; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.ai-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 14px; color: var(--fg); transition: border-color .2s, box-shadow .2s; white-space: nowrap; }
.ai-btn:hover { border-color: var(--faint); }
.ai-btn[aria-pressed='true'] { border-color: var(--fg); box-shadow: 0 0 0 3px rgb(232 163 59 / .22); }
.ai-btn kbd { font: 600 11px var(--font); letter-spacing: .02em; padding: 2px 6px; border-radius: 6px; background: var(--subtle); color: var(--muted); }
/* The assistant's mark in the top bar: a still of the glazed logo (see paintMarks). */
.orb { display: block; width: 26px; height: 26px; flex: none; }
.stop-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 10px; border-radius: 999px; background: var(--stop); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; }
.stop-btn i { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; }
.stop-btn i::before { content: ''; width: 10px; height: 10px; border-radius: 2px; background: #fff; }
.me { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font); color: #fff; background: #3e6de0; flex: none; transition: box-shadow .2s; }
.me:hover { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--line); }

/* The page and, beside it, the assistant's column. */
.body { flex: 1; min-height: 0; display: flex; }
.page { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 32px 48px; }
.page h1 { margin: 0 0 24px; font: 800 34px/1.05 var(--display); letter-spacing: -.04em; }
.cfg { display: grid; gap: 24px; grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
.cfg-nav { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); position: sticky; top: 0; }
.cfg-nav a { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 14px; font-size: 14px; font-weight: 500; color: var(--fg-2); text-decoration: none; white-space: nowrap; }
.cfg-nav a svg { color: var(--muted); }
.cfg-nav a:hover { background: var(--subtle); color: var(--fg); }
.cfg-nav a.on { border-color: var(--line); background: var(--bg); font-weight: 600; color: var(--fg); box-shadow: 0 1px 2px rgb(21 20 15 / .06); }
.cfg-nav a.on svg { color: var(--fg); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sec-head h2 { margin: 0; font: 700 22px/1.2 var(--display); letter-spacing: -.02em; }
.sec-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.views { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.views a { height: 30px; padding: 0 12px; display: flex; align-items: center; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--fg-2); text-decoration: none; }
.views a.on { background: var(--accent); color: var(--accent-fg); }
.find { height: 40px; width: 288px; max-width: 100%; display: flex; align-items: center; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 14px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); }
.table { min-width: 640px; }
.tr { display: grid; grid-template-columns: minmax(220px, 2fr) 1fr 1.3fr .8fr 64px; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line-soft); cursor: pointer; transition: background .2s; }
.tr.head { border-top: 0; padding-block: 11px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: default; }
.tr:not(.head):hover { background: var(--hover); }
.tr.sel { background: var(--row-sel); box-shadow: inset 2px 0 0 var(--amber); }
.person { min-width: 0; }
.person b { display: block; font-weight: 500; color: var(--fg); }
.person span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dept { color: var(--fg-2); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--subtle); color: var(--fg-2); }
.st { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.st.active { color: var(--good); background: var(--good-soft); } .st.invited { color: var(--warn); background: var(--warn-soft); } .st.off { color: var(--muted); background: var(--off-soft); }
.edit { justify-self: end; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.tr.fresh, .li.fresh { animation: rowIn 2.4s var(--ease); }
@keyframes rowIn { 0% { opacity: 0; transform: translateY(-8px); background: rgba(232,163,59,.3); } 25% { opacity: 1; transform: none; background: rgba(232,163,59,.2); } 100% { background: transparent; } }

/* The assistant's column: the page narrows to make room, as in AppShell. */
.dock { position: relative; flex: none; width: 0; transition: width .8s var(--ease); }
.dock.open { width: 468px; }

/* ------------------------------------------------------------ the glass */
/* Two layers share one frame: the glass (which sees what is behind it) and the
   content above it. Glass nested inside glass goes blind in Chromium, so the
   composer's own glass only works if the panel's glass is a sibling, not a parent. */
.ai, .ai-glass { position: absolute; top: 6px; right: 14px; bottom: 14px; width: 440px; border-radius: 28px;
  opacity: 0; transform: translateX(40px) scale(.97); pointer-events: none;
  transition: opacity .4s ease, transform .8s var(--ease), --cx .9s var(--ease), --cy .9s var(--ease); }
.ai.open, .ai-glass.open { opacity: 1; transform: none; }
.ai.open { pointer-events: auto; }
.ai-glass { z-index: 49; background: var(--g-tint);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  box-shadow: var(--g-shadow), var(--g-inner); }
.ai { z-index: 50; overflow: hidden; isolation: isolate; color: var(--ai-fg); container-type: inline-size; --lx: 70%; --ly: -10%; }

/* The core's light, pooled on the glass around wherever the core sits. */
.ai-pool { position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(240px 200px at var(--cx) var(--cy), var(--pool-a), transparent 70%),
    radial-gradient(220px 170px at calc(var(--cx) + 70px) calc(var(--cy) + 50px), var(--pool-b), transparent 70%),
    linear-gradient(180deg, transparent 55%, rgba(0,0,0,.12)); }
/* Normal blending on purpose: a blended layer here stops the composer's glass from seeing the conversation behind it. */
.ai-grain { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: var(--grain);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* The glass edge: a hairline that catches light where the pointer is. */
.ai-rim, .ai-edge, .ai-edge-glow { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.ai-rim { z-index: 30; padding: 1px;
  background:
    radial-gradient(280px circle at var(--lx) var(--ly), var(--rim-hot), transparent 60%),
    linear-gradient(160deg, var(--rim-base), var(--rim-low) 32%, var(--rim-low) 72%, var(--rim-base)); }
/* While it thinks or runs, a thread of light travels round the edge. */
.ai-edge, .ai-edge-glow { z-index: 31; opacity: 0; transition: opacity .7s ease;
  background: conic-gradient(from var(--spin), transparent 0 240deg, rgba(255,138,107,0) 252deg, var(--coral) 290deg, var(--amber) 318deg, #fff7e8 332deg, var(--teal) 348deg, transparent 360deg); }
.ai-edge { padding: 1.5px; }
.ai-edge-glow { padding: 12px; filter: blur(10px); }
.ai.busy .ai-edge { opacity: 1; animation: spin 3.4s linear infinite; }
.ai.busy .ai-edge-glow { opacity: .55; animation: spin 3.4s linear infinite; }
@keyframes spin { to { --spin: 360deg; } }

/* The core: one lit object, rendered in WebGL. */
#core { position: absolute; left: 0; top: 0; width: 200px; height: 200px; z-index: 11; pointer-events: none;
  transform-origin: 0 0; transition: transform 1s var(--ease), opacity .6s ease; }
#core.flat { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-14 -14 56 56'><rect width='13' height='13' rx='4' fill='%2315140f'/><circle cx='21.5' cy='6.5' r='6.5' fill='%23f26b4f'/><circle cx='6.5' cy='21.5' r='6.5' fill='%231e9e8a'/><rect x='15' y='15' width='13' height='13' rx='4' fill='%23e8a33b'/></svg>") center / contain no-repeat; }

/* Header */
.ai-head { position: absolute; top: 0; left: 0; right: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; }
/* Progressive blur: the conversation frosts over as it slides under the header. */
.ai-head::before { content: ''; position: absolute; inset: 0 0 -22px 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, var(--g-head) 30%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  -webkit-mask: linear-gradient(#000 55%, transparent); mask: linear-gradient(#000 55%, transparent); }
.slot-head { width: 38px; height: 38px; flex: none; }
.ai-title { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.ai-title b { font: 600 14.5px var(--display); letter-spacing: -.015em; white-space: nowrap; }
.ai-status { display: flex; align-items: center; gap: 6px; font: 500 12px var(--font); color: var(--ai-muted); white-space: nowrap; }
.ai-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }
.ai.busy .ai-status i { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.seg { margin-left: auto; position: relative; display: flex; padding: 3px; border-radius: 999px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line); flex: none; }
.seg button { position: relative; z-index: 1; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--ai-muted); transition: color .3s; }
.seg button.on { color: var(--ai-fg); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--bubble); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px var(--chip-line), 0 6px 14px -6px rgba(0,0,0,.5); transition: transform .5s var(--ease), width .5s var(--ease); }
.ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ai-fg-2); transition: background .2s, color .2s; flex: none; }
.ico:hover { background: var(--chip-hover); color: var(--ai-fg); }

/* Scrolling body: fades into the glass under the header. */
.ai-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 70px 22px 156px; scrollbar-width: thin; scrollbar-color: var(--ai-line) transparent;
  -webkit-mask: linear-gradient(to bottom, transparent 0, #000 52px, #000 calc(100% - 70px), transparent calc(100% - 36px));
  mask: linear-gradient(to bottom, transparent 0, #000 52px, #000 calc(100% - 70px), transparent calc(100% - 36px)); }

/* Welcome */
.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; transition: opacity .35s ease, transform .5s var(--ease); }
.welcome.leaving { opacity: 0; transform: translateY(-10px); }
.slot-hero { width: 184px; height: 184px; margin: -6px 0 -10px; flex: none; }
.eyebrow { margin: 0 0 10px; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-faint); }
.greet { margin: 0; font: 800 30px/1.1 var(--display); letter-spacing: -.04em; text-wrap: balance; }
.greet em { font-style: normal; }
.lede { margin: 12px 0 0; max-width: 35ch; color: var(--ai-fg-2); font-size: 14px; line-height: 1.55; text-wrap: pretty; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; width: 100%; text-align: left; }
.tile { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; overflow: hidden; text-align: left;
  background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line), inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.08);
  transition: transform .5s var(--ease), background .3s; --mx: 50%; --my: 0%; }
.tile::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(180px circle at var(--mx) var(--my), rgba(255,246,228,.12), transparent 65%); }
:root[data-theme='light'] .tile::after { background: radial-gradient(180px circle at var(--mx) var(--my), rgba(255,255,255,.9), transparent 65%); }
.tile:hover { transform: translateY(-2px); background: var(--chip-hover); }
.tile:hover::after { opacity: 1; }
.tile .ti { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
.tile b { position: relative; z-index: 1; font-weight: 600; font-size: 13.5px; display: block; }
.tile span { position: relative; z-index: 1; display: block; color: var(--ai-muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
.ti.coral { color: var(--ti-coral); background: var(--ti-coral-bg); }
.ti.amber { color: var(--ti-amber); background: var(--ti-amber-bg); }
.ti.teal { color: var(--ti-teal); background: var(--ti-teal-bg); }
.ti.pearl { color: var(--ai-fg); background: var(--bubble); }
/* Suggestions: four, picked for the page and the selection. */
.tiles-head { align-self: stretch; display: flex; align-items: center; gap: 8px; margin: 24px 0 0; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-muted); text-align: left; }
.tiles-head i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); flex: none; }
.tile .att { color: var(--ti-coral); font-weight: 600; }
.browse { margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 14px; border-radius: 14px; color: var(--ai-fg-2); font-size: 13.5px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--chip-line); transition: background .2s, color .2s; }
.browse:hover { background: var(--chip); color: var(--ai-fg); }
.browse > span:nth-child(2) { flex: 1; text-align: left; }
.browse kbd, .cat-search kbd { font: 700 12px var(--font); min-width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--bubble); color: var(--ai-muted); box-shadow: inset 0 -1px 0 var(--chip-line); }

/* Everything it can do: searchable, grouped, and only what the person may do. */
.catalog { display: flex; flex-direction: column; gap: 12px; padding-top: 2px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 8px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ai-fg-2); box-shadow: inset 0 0 0 1px var(--chip-line); transition: background .2s; }
.back:hover { background: var(--bubble); color: var(--ai-fg); }
.back svg { width: 15px; height: 15px; }
.cat-title { margin: 4px 0 0; font: 800 22px/1.15 var(--display); letter-spacing: -.03em; }
.cat-sub { margin: -6px 0 0; color: var(--ai-muted); font-size: 13px; }
.cat-search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line); color: var(--ai-muted); transition: box-shadow .25s; }
.cat-search:focus-within { box-shadow: inset 0 0 0 1px rgba(232,163,59,.5), 0 0 0 3px rgb(232 163 59 / .16); }
.cat-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 14px var(--font); color: var(--ai-fg); }
.cat-search input::placeholder { color: var(--ai-faint); }
.cat-legend { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--ai-muted); }
.cat-legend .kind:not(:first-child) { margin-left: 8px; }
.kind { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.kind.k-plan { color: var(--flag); background: var(--flag-bg); }
.kind.k-answer { color: var(--ok); background: var(--ok-bg); }
.kind.k-instant { color: var(--ai-fg-2); background: var(--bubble); }
.cat-group h4 { margin: 10px 0 2px; padding: 0 8px; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-faint); }
.cap-row { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; text-align: left; transition: background .15s; }
.cap-row:hover, .cap-row.on { background: var(--bubble); }
.cap-row .ti { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.cap-row b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.cap-row .h { display: block; color: var(--ai-muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap-row .h.att { color: var(--ti-coral); font-weight: 600; }
.cat-empty { margin: 4px 0; color: var(--ai-muted); font-size: 13px; padding: 4px 8px; }
.cat-note { margin: 4px 0 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ai-faint); }
.cat-note svg { width: 14px; height: 14px; }

/* Type / in the box: the same list, as a menu above it. */
.slash { position: absolute; left: 14px; right: 14px; bottom: var(--slash-b, 140px); z-index: 13; max-height: min(360px, 55%); overflow-y: auto; padding: 6px; border-radius: 20px;
  background: var(--g-pop); -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px var(--chip-line), 0 24px 48px -24px rgba(21,20,15,.45);
  animation: pop .35s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.slash-head { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px 4px; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-faint); }
.slash-head span:last-child { letter-spacing: 0; text-transform: none; font-weight: 500; }
.slash .cap-row { padding: 7px 8px; grid-template-columns: 28px minmax(0, 1fr) auto; }
.slash .cap-row .ti { width: 28px; height: 28px; border-radius: 9px; }
.reveal > * { animation: rise .9s var(--ease) both; }
.reveal > *:nth-child(2) { animation-delay: .12s; } .reveal > *:nth-child(3) { animation-delay: .2s; }
.reveal > *:nth-child(4) { animation-delay: .28s; } .reveal > *:nth-child(5) { animation-delay: .36s; } .reveal > *:nth-child(6) { animation-delay: .44s; } .reveal > *:nth-child(7) { animation-delay: .62s; } .reveal > *:nth-child(8) { animation-delay: .7s; }
.reveal .tile { animation: rise .9s var(--ease) both; }
.reveal .tile:nth-child(1) { animation-delay: .4s; } .reveal .tile:nth-child(2) { animation-delay: .46s; }
.reveal .tile:nth-child(3) { animation-delay: .52s; } .reveal .tile:nth-child(4) { animation-delay: .58s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } }

/* Conversation */
.thread { display: flex; flex-direction: column; gap: 18px; padding-top: 4px; perspective: 900px; }
.enter { animation: fromDepth .8s var(--ease) both; }
@keyframes fromDepth { from { opacity: 0; transform: translate3d(0, 12px, -70px) rotateX(10deg); filter: blur(8px); } }
.m-user { align-self: flex-end; max-width: 86%; padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: var(--bubble);
  box-shadow: inset 0 0 0 1px var(--bubble-line), inset 0 1px 0 rgba(255,255,255,.08); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.m-ai { font-size: 14.5px; line-height: 1.62; color: var(--ai-fg); }
.m-ai p { margin: 0 0 8px; } .m-ai p:last-child { margin-bottom: 0; }
.m-ai ul { margin: 4px 0 8px; padding-left: 18px; } .m-ai li { margin: 3px 0; } .m-ai li::marker { color: var(--amber); }
.m-ai strong { font-weight: 600; }
.w { animation: word .55s var(--ease) both; }
@keyframes word { from { opacity: 0; filter: blur(5px); } }
.m-quiet { font: 500 12.5px var(--font); color: var(--ai-faint); }

.trace { display: flex; flex-direction: column; gap: 6px; font: 400 13px/1.4 var(--font); color: var(--ai-muted); }
.trace .row { display: flex; align-items: center; gap: 9px; min-width: 0; }
.trace .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai-faint); flex: none; transition: background .3s, box-shadow .3s; }
.trace .row.live .dot { background: var(--amber); box-shadow: 0 0 0 4px rgba(245,182,79,.14), 0 0 10px var(--amber); }
.trace .row.live .lbl { background: linear-gradient(90deg, var(--ai-muted) 0 35%, var(--ai-fg) 50%, var(--ai-muted) 65%) 0 0 / 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 1.3s linear infinite; }
.trace .row.done .dot { background: var(--teal); }
.trace .lbl { white-space: nowrap; flex: none; }
.trace .res { color: var(--ai-fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@keyframes sheen { from { background-position: 100% 0; } to { background-position: -60% 0; } }
.trace-sum { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font: 600 12.5px var(--font); color: var(--ai-muted); padding: 4px 10px 4px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--chip-line); }
.trace-sum:hover { background: var(--chip); color: var(--ai-fg-2); }
.trace-sum i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
.trace-sum svg { width: 13px; height: 13px; transition: transform .3s var(--ease); }
.trace-sum[aria-expanded='true'] svg { transform: rotate(90deg); }

.qr { display: flex; gap: 8px; flex-wrap: wrap; }
.qr button { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line), inset 0 1px 0 rgba(255,255,255,.06); font-size: 13px; font-weight: 600; transition: background .2s, transform .3s var(--ease); }
.qr button:hover { background: var(--chip-hover); transform: translateY(-1px); }
.qr button:disabled { opacity: .4; cursor: default; transform: none; }

.sys { display: flex; align-items: center; gap: 8px; font: 500 12.5px var(--font); color: var(--ai-muted); }
.sys svg { width: 14px; height: 14px; color: var(--amber); }

/* The plan: a thicker tile of glass you can feel turn under the pointer. */
.plan { position: relative; border-radius: 22px; padding: 16px 16px 14px; background: var(--plan);
  box-shadow: inset 0 0 0 1px var(--chip-line), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.1), var(--plan-shadow);
  transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .7s var(--ease), opacity .4s; --mx: 50%; --my: 0%; }
.plan::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(260px circle at var(--mx) var(--my), rgba(255,246,228,.09), transparent 65%); }
:root[data-theme='light'] .plan::before { background: radial-gradient(260px circle at var(--mx) var(--my), rgba(255,255,255,.95), transparent 65%); }
.plan > * { position: relative; }
.plan-eyebrow { display: flex; align-items: center; gap: 8px; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-faint); }
.plan-eyebrow i { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
.plan h3 { margin: 6px 0 16px; font: 600 17px/1.25 var(--display); letter-spacing: -.025em; }
.steps { position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.steps::before { content: ''; position: absolute; left: 13.25px; top: 14px; bottom: 14px; width: 1.5px; background: var(--ai-line); border-radius: 2px; }
.rail { position: absolute; left: 13.25px; top: 14px; width: 1.5px; height: var(--fill, 0px); border-radius: 2px;
  background: linear-gradient(var(--amber), var(--teal)); box-shadow: 0 0 10px rgba(245,182,79,.6); transition: height 1s var(--ease); }
.step { position: relative; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; transition: opacity .4s; }
.node { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--font); color: var(--ai-muted);
  background: var(--node); box-shadow: inset 0 0 0 1px var(--chip-line); transition: background .4s, box-shadow .4s, color .4s; }
.node svg { width: 14px; height: 14px; stroke-width: 2.4; }
.step.running .node { color: var(--ai-fg); box-shadow: inset 0 0 0 1px rgba(245,182,79,.55), 0 0 0 5px rgba(245,182,79,.09), 0 0 20px rgba(245,182,79,.45); }
.step.running .node::after { content: ''; position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 70%, var(--amber) 88%, #fff6e6 100%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.6px), #000 calc(100% - 1.4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 1.6px), #000 calc(100% - 1.4px));
  animation: turn 1s linear infinite; }
@keyframes turn { to { transform: rotate(1turn); } }
.step.done .node { color: #15140f; background: radial-gradient(circle at 35% 28%, #fffdf8, #efe5d2 70%); box-shadow: 0 0 0 1px rgba(255,255,255,.4), 0 0 16px rgba(255,236,200,.4); }
:root[data-theme='light'] .step.done .node { color: #fff; background: radial-gradient(circle at 35% 28%, #3b382f, #12110d 70%); box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
.step.failed .node { color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.step.skipped { opacity: .42; }
.step b { display: block; font-weight: 600; font-size: 14px; line-height: 1.35; }
.step .det { color: var(--ai-muted); font-size: 12.5px; margin-top: 2px; }
.flag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--flag); background: var(--flag-bg); padding: 3px 9px 3px 7px; border-radius: 999px; }
.flag svg { width: 12px; height: 12px; }
.sum { margin-top: 7px; font-size: 12.5px; line-height: 1.4; color: var(--ok); display: flex; gap: 6px; align-items: flex-start; }
.sum svg { margin-top: 2px; flex: none; }
.sum.bad { color: var(--bad); }
.st-r { font: 600 12px var(--font); font-variant-numeric: tabular-nums; color: var(--ai-faint); padding-top: 6px; white-space: nowrap; }
.step.running .st-r { color: var(--amber); } .step.done .st-r { color: var(--ok); }
.plan-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--ai-line); flex-wrap: wrap; }
.plan-foot .note { flex: 1 1 140px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ai-muted); min-width: 0; }
.plan-foot .note svg { width: 14px; height: 14px; }
.plan-foot .note.ok { color: var(--ok); } .plan-foot .note.ok svg { color: var(--ok); }
.b-ghost { height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--ai-fg-2); box-shadow: inset 0 0 0 1px var(--chip-line); transition: background .2s, color .2s; white-space: nowrap; }
.b-ghost:hover { background: var(--chip-hover); color: var(--ai-fg); }
.b-run { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px 0 13px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--cta-fg); background: var(--cta);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 10px 24px -12px var(--cta-glow); transition: transform .4s var(--ease); white-space: nowrap; }
.b-run:hover { transform: translateY(-1px); }
.b-run::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.7) 50%, transparent 65%); transform: translateX(-130%); }
:root[data-theme='light'] .b-run::after { background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); }
.b-run:hover::after { transform: translateX(130%); transition: transform 1s var(--ease); }
.b-run svg { width: 15px; height: 15px; }
.progress { flex: 1 1 100%; height: 2px; border-radius: 2px; background: var(--ai-line); overflow: hidden; margin-bottom: 4px; }
.progress i { display: block; height: 100%; width: var(--p, 0%); background: linear-gradient(90deg, var(--coral), var(--amber), var(--teal)); box-shadow: 0 0 10px var(--amber); transition: width 1s var(--ease); }
.link { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ai-fg); padding: 6px 4px; }
.link svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }
.link:hover svg { transform: translateX(3px); }
.plan.cancelled { opacity: .62; }

/* History */
.history { display: flex; flex-direction: column; gap: 22px; padding-top: 4px; }
.h-group h4 { margin: 0 0 6px; padding: 0 10px; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-faint); }
.h-item { width: 100%; display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; text-align: left; transition: background .2s; }
.h-item:hover { background: var(--chip); }
.h-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--ai-fg-2); background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line); }
.h-item b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.h-item span { display: block; color: var(--ai-muted); font-size: 12px; margin-top: 1px; }
.h-item span.why { color: var(--bad); }
.state { font: 600 12px var(--font); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.state.done { color: var(--ok); background: var(--ok-bg); }
.state.refused { color: var(--bad); background: var(--bad-bg); }
.state.stopped, .state.cancelled { color: var(--ai-muted); background: var(--chip); }
.skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--chip) 0%, var(--chip-hover) 50%, var(--chip) 100%) 0 0 / 200% 100%; animation: sheen 1.2s linear infinite; }

/* Composer: a capsule of glass the conversation slides under. */
.composer { position: absolute; left: 14px; right: 14px; bottom: 34px; z-index: 12; border-radius: 24px; padding: 10px 10px 10px 14px;
  background: var(--g-comp);
  -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.08), 0 22px 44px -22px rgba(0,0,0,.75);
  display: flex; flex-direction: column; gap: 8px; transition: box-shadow .35s; }
:root[data-theme='light'] .composer { box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(60,45,15,.1), 0 20px 40px -24px rgba(70,52,20,.4); }
.composer:focus-within { box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px rgba(232,163,59,.45), 0 0 0 3px rgb(232 163 59 / .18), 0 22px 44px -22px rgba(0,0,0,.45); }
.ctx { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 3px 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--ai-fg-2); background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line); max-width: 100%; }
.ctx > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; }
.ctx button { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--ai-muted); flex: none; }
.ctx button:hover { background: var(--chip-hover); color: var(--ai-fg); }
.ctx button svg { width: 11px; height: 11px; stroke-width: 2.2; }
.comp-row { display: flex; align-items: flex-end; gap: 10px; }
.comp-row textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--ai-fg); font: 14.5px/1.5 var(--font); max-height: 140px; padding: 5px 0; }
.comp-row textarea::placeholder { color: var(--ai-faint); }
.send { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--cta-fg); background: var(--cta);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 8px 20px -10px var(--cta-glow); transition: transform .35s var(--ease), opacity .3s; }
.send:not(:disabled):hover { transform: scale(1.07); }
.send:disabled { opacity: .3; cursor: default; }
.send svg { width: 17px; height: 17px; stroke-width: 2.2; }
.foot { position: absolute; left: 0; right: 0; bottom: 11px; z-index: 12; text-align: center; font-size: 11.5px; color: var(--ai-faint); padding: 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===================================================== getting started */
/* There is no tour. A new person's first steps live inside the assistant: a
   ring of light round the core with one bead per step, a card of the steps,
   and for each step the three things the assistant always does: explain it,
   show where it lives on the page, or prepare it as a plan. */

/* The setup orbit: a tilted ring drawn on two canvases, the far half behind the
   core and the near half in front of it. CSS 3D with clip-path left stray arcs in Chromium. */
.orbit { position: absolute; left: 0; top: 0; width: 400px; height: 400px; margin: -200px 0 0 -200px; pointer-events: none; opacity: 0;
  transform-origin: 50% 50%; transition: transform 1s var(--ease), opacity .6s ease; }
.orbit.on { opacity: 1; }
.orbit.o-far { z-index: 10; }
.orbit.o-near { z-index: 12; }

/* The steps: the same thick glass as a plan, without the tilt. */
.guide-slot { width: 100%; margin-top: 22px; text-align: left; }
.guide { padding-bottom: 12px; }
.g-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.g-head h3 { margin: 6px 0 12px; }
.g-time { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font); color: var(--ai-muted); white-space: nowrap; padding-top: 1px; }
.g-time svg { width: 13px; height: 13px; }
.g-steps { position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.g-steps::before { content: ''; position: absolute; left: 13.25px; top: 18px; bottom: 18px; width: 1.5px; background: var(--ai-line); border-radius: 2px; }
.g-steps .rail { top: 18px; }
.g-row { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 4px 0; text-align: left; border-radius: 12px; }
.g-row:disabled { cursor: default; }
.g-step.todo .g-row:hover .g-txt b { text-decoration: underline; text-decoration-color: var(--ai-faint); text-underline-offset: 3px; }
.g-txt { min-width: 0; }
.g-txt b { display: block; font-weight: 600; font-size: 14px; line-height: 1.3; }
.g-txt > span { display: block; color: var(--ai-muted); font-size: 12px; line-height: 1.35; margin-top: 1px; }
.g-step.done .g-txt b { color: var(--ai-muted); font-weight: 500; }
.g-step.done .node, .step.done .node { color: #15140f; }
.g-step.done .node { background: radial-gradient(circle at 35% 28%, #fffdf8, #efe5d2 70%); box-shadow: 0 0 0 1px rgba(255,255,255,.4), 0 0 12px rgba(255,236,200,.35); }
:root[data-theme='light'] .g-step.done .node { color: #fff; background: radial-gradient(circle at 35% 28%, #3b382f, #12110d 70%); box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
.g-step.next .node { color: var(--ai-fg); box-shadow: inset 0 0 0 1px rgba(245,182,79,.6), 0 0 0 5px rgba(245,182,79,.1), 0 0 18px rgba(245,182,79,.4); }
.g-tag { font: 600 11.5px var(--font); color: var(--ai-faint); white-space: nowrap; }
.g-step.next .g-tag { color: var(--flag); background: var(--flag-bg); padding: 2px 8px; border-radius: 999px; }
.g-step.done .g-tag { color: var(--ok); }
.g-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s var(--ease); margin-left: 40px; }
.g-more > div { overflow: hidden; min-height: 0; }
.g-step.open .g-more { grid-template-rows: 1fr; }
.g-why { margin: 2px 0 10px; font-size: 13px; line-height: 1.5; color: var(--ai-fg-2); text-wrap: pretty; }
.g-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 12px; }
.g-acts .link { padding: 6px 2px; color: var(--ai-fg-2); font-weight: 500; text-decoration: underline; text-decoration-color: var(--ai-faint); text-underline-offset: 3px; }
.g-acts .link:hover { color: var(--ai-fg); }
.b-ghost { display: inline-flex; align-items: center; gap: 7px; }
.b-ghost svg { width: 14px; height: 14px; }
.g-foot { display: flex; align-items: center; gap: 7px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--ai-line); font-size: 12px; color: var(--ai-muted); }
.g-foot svg { width: 14px; height: 14px; flex: none; }
.g-foot > span { flex: 1; min-width: 0; }
.g-foot .link { padding: 2px 0; font-weight: 600; color: var(--ai-fg-2); }
/* Folded away: one row to pick it up again, or to show it's finished. */
.g-mini { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 16px; text-align: left; background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line); transition: background .2s; }
button.g-mini:hover { background: var(--chip-hover); }
.g-mini .gm-t { flex: 1; min-width: 0; }
.g-mini b { display: block; font-size: 13.5px; font-weight: 600; }
.g-mini .gm-t span { display: block; font-size: 12px; color: var(--ai-muted); }
.g-mini .go { font: 600 12.5px var(--font); color: var(--ai-fg-2); display: inline-flex; align-items: center; gap: 4px; }
.g-mini .go svg { width: 14px; height: 14px; }
.ring { --gp: 0%; position: relative; width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 10.5px var(--font); color: var(--ai-fg-2); font-variant-numeric: tabular-nums; }
.ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; transition: --gp 1.4s var(--ease);
  background: conic-gradient(var(--coral), var(--amber) calc(var(--gp) * .55), var(--teal) var(--gp), var(--o-track) var(--gp));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
.ring.full { color: var(--ok); }

/* In the conversation: "step done" and the next step, ready to go. */
.g-next { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 4px; border-radius: 20px; background: var(--chip);
  box-shadow: inset 0 0 0 1px var(--chip-line), inset 0 1px 0 rgba(255,255,255,.08); }
.gn-top { display: flex; align-items: center; gap: 12px; }
.gn-eye { display: block; font: 700 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ai-faint); margin-bottom: 2px; }
.gn-top b { display: block; font-weight: 600; font-size: 14.5px; }
.gn-top .gn-sub { display: block; color: var(--ai-muted); font-size: 12.5px; }
.g-next .g-acts { padding-bottom: 10px; }
.g-next.used .g-acts button:not([data-act='show']) { opacity: .4; pointer-events: none; }
.sys.win svg { color: var(--teal); }
.sys .ring { width: 18px; height: 18px; }
.sys .ring::before { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }

/* The header's status doubles as the way back to the steps. */
.ai-status.setup { cursor: pointer; color: var(--ai-fg-2); }
.ai-status.setup:hover span { text-decoration: underline; text-underline-offset: 3px; }
.ai-status.setup i { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

/* Show me where: a thread of light from the core to the thing, which then glows. */
.beam { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 80; overflow: visible; }
.beam path { fill: none; stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(245,182,79,.9)); transition: opacity .6s ease; }
.beam circle { filter: drop-shadow(0 0 8px #fff2d8) drop-shadow(0 0 16px rgba(245,182,79,.9)); }
.beacon { position: fixed; z-index: 79; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
.beacon.on { opacity: 1; }
.beacon::before, .beacon::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: conic-gradient(from var(--spin), var(--coral), var(--amber), #fff4de, var(--teal), var(--coral));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: spin 2.4s linear infinite; }
.beacon::before { padding: 2px; }
.beacon::after { padding: 8px; filter: blur(9px); opacity: .7; }
.beacon i { position: absolute; inset: -2px; border-radius: inherit; box-shadow: 0 0 0 0 rgba(232,163,59,.5); animation: ping 1.8s ease-out infinite; }
@keyframes ping { to { box-shadow: 0 0 0 14px rgba(232,163,59,0); } }
.beacon-tag { position: fixed; z-index: 81; pointer-events: none; display: flex; align-items: center; gap: 8px; max-width: 280px; padding: 8px 12px 8px 10px; border-radius: 14px;
  background: var(--g-pop); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px var(--chip-line), 0 18px 36px -18px rgba(21,20,15,.5);
  color: var(--ai-fg); font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .5s var(--ease); }
.beacon-tag.on { opacity: 1; transform: none; }
.beacon-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); flex: none; }

/* Top bar: the orb wears the setup ring while there is setup left. */
.orb-wrap { position: relative; width: 30px; height: 30px; display: grid; place-items: center; flex: none; margin-left: -2px; }
.orb-wrap .orb { width: 26px; height: 26px; transition: width .4s var(--ease), height .4s var(--ease); }
.orb-wrap.prog .orb { width: 22px; height: 22px; }
.orb-wrap::before { content: ''; position: absolute; inset: 0; border-radius: 50%; opacity: 0; transition: opacity .4s, --gp 1.4s var(--ease);
  background: conic-gradient(var(--coral), var(--amber) calc(var(--gp) * .55), var(--teal) var(--gp), var(--line) var(--gp));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
.orb-wrap.prog::before { opacity: 1; }
.ai-prog { font: 600 12px var(--font); font-variant-numeric: tabular-nums; color: var(--muted); padding-left: 2px; }
/* When the panel is closed, the next step waits under the button for a moment. */
.nudge { position: fixed; z-index: 85; width: 300px; display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 12px; border-radius: 18px;
  background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 24px 50px -24px rgba(21,20,15,.45); animation: pop .5s var(--ease) both; }
.nudge::before { content: ''; position: absolute; top: -6px; left: var(--ax, 230px); width: 12px; height: 12px; background: var(--panel); box-shadow: -1px -1px 0 var(--line); transform: rotate(45deg); }
.nudge .ring { color: var(--fg-2); }
.nudge .ring::before { background: conic-gradient(var(--coral), var(--amber) calc(var(--gp) * .55), var(--teal) var(--gp), var(--line) var(--gp)); }
.nudge > div { flex: 1; min-width: 0; }
.nudge b { display: block; font-size: 13.5px; font-weight: 600; color: var(--fg); }
.nudge span { display: block; font-size: 12px; color: var(--muted); }
.nudge button { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 12.5px; flex: none; }

/* Pages beyond Users, drawn as simply as Noma draws them. */
.page-sub { margin: -16px 0 24px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.card { border: 1px solid var(--line); border-radius: 22px; background: var(--panel); padding: 18px 18px 8px; }
.card h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font: 700 15px var(--display); letter-spacing: -.01em; }
.card h3 span { font: 600 12px var(--font); color: var(--muted); }
.li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
.li > div { flex: 1; min-width: 0; }
.li b { display: block; font-weight: 500; }
.li small { display: block; color: var(--muted); font-size: 12px; }
.empty { border: 1px dashed var(--faint); border-radius: 22px; padding: 44px 24px; text-align: center; color: var(--muted); background: var(--panel); }
.empty b { display: block; color: var(--fg); font: 700 18px var(--display); letter-spacing: -.02em; margin-bottom: 6px; }
.empty p { margin: 0 auto; max-width: 44ch; }
.empty .btn { margin-top: 18px; }
.bot-av { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--subtle); color: var(--fg-2); flex: none; }
.cell-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
.st.ready { color: var(--warn); background: var(--warn-soft); }
.st.working { color: var(--good); background: var(--good-soft); }
.st.working::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; animation: blink 1.4s ease-in-out infinite; }


/* Theme change: the new theme spreads out from the core. */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

@media (max-height: 780px) {
  .slot-hero { width: 140px; height: 140px; margin: -4px 0 -6px; }
  .greet { font-size: 26px; }
  .lede { font-size: 13.5px; }
  .tile { padding: 12px; gap: 8px; }
}
@container (max-width: 420px) { .ai-title { display: none; } .seg { margin-left: auto; } .slash-head span:last-child { display: none; } }
@media (max-width: 1360px) { .navbar { order: 9; flex-basis: 100%; } }
@media (max-width: 1100px) {
  .cfg { grid-template-columns: 1fr; } .cfg-nav { flex-direction: row; overflow-x: auto; position: static; }
  .ai-btn kbd { display: none; }
}
@media (max-width: 900px) {
  /* Too narrow to sit beside the page: the panel covers it instead. */
  .dock.open { width: 0; }
  .ai, .ai-glass { position: fixed; top: 76px; left: 8px; right: 8px; bottom: 8px; width: auto; }
  .top { padding: 12px 16px; } .page { padding: 12px 16px 40px; } .navbar { display: none; }
  .stop-btn span, .ai-btn > span:not(.orb-wrap) { display: none; }
.stop-btn { padding: 0 8px; } .ai-btn { padding: 0 6px; }
}
@media (max-width: 460px) { .space-btn { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

}

/* Pointer: the rim catches light, the core leans toward you, cards turn. */
ai.addEventListener('pointermove', e => {
  const r = ai.getBoundingClientRect();
  ai.style.setProperty('--lx', `${e.clientX - r.left}px`); ai.style.setProperty('--ly', `${e.clientY - r.top}px`);
  const c = coreEl.getBoundingClientRect();
  core.tilt((e.clientX - (c.left + c.width / 2)) / 260, -(e.clientY - (c.top + c.height / 2)) / 260);
  const tile = e.target.closest('.tile, .plan');
  if (tile) {
    const t = tile.getBoundingClientRect(); const mx = e.clientX - t.left, my = e.clientY - t.top;
    tile.style.setProperty('--mx', `${mx}px`); tile.style.setProperty('--my', `${my}px`);
    if (tile.classList.contains('plan') && !tile.classList.contains('guide')) {
      tile.style.setProperty('--ry', `${((mx / t.width) - .5) * 5}deg`);

ai.addEventListener('pointerleave', () => { core.tilt(0, 0); ai.style.setProperty('--lx', '70%'); ai.style.setProperty('--ly', '-10%'); });

/* Composer */
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', () => { autosize(); syncSend(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
$('#composer').addEventListener('submit', e => { e.preventDefault(); if (S.busy && !S.running) { S.aborted = true; return; } submit(); });
function submit() { const t = input.value.trim(); if (!t || S.busy) return; input.value = ''; autosize(); send(t); }
$('#tiles').addEventListener('click', async e => {
  const tile = e.target.closest('.tile'); if (!tile || S.busy) return;
  const text = tile.dataset.ask; const seq = S.seq;
  input.focus();
  for (let i = 1; i <= text.length; i += 2) { if (seq !== S.seq) return; input.value = text.slice(0, i + 1); autosize(); await wait(9); }
  syncSend(); await wait(220); if (seq === S.seq) submit();
});

function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function toBottom() { scroll.scrollTo({ top: scroll.scrollHeight, behavior: 'smooth' }); }
function add(node) { thread.append(node); hydrateIcons(node); toBottom(); return node; }

// A step's buttons pass their own flow; anything typed goes through route().
async function send(text, flow) {
  // While a question is open, work out what this message is (see classify).
  if (S.awaiting) {
    const a = S.awaiting, kind = flow ? 'switch' : classify(text, a);
    if (S.view !== 'chat') setView('chat');
    if (kind === 'aside') return answerAside(text, a);
    if (kind === 'answer' || kind === 'cancel') {
      S.awaiting = null;
      add(el('div', 'm-user enter')).textContent = text;
      S.aborted = false; setBusy(true, 'Thinking…');
      a.res(kind === 'cancel' ? null : text.trim());
      return;
    }
    // A new request: the open one is set aside, and nothing it planned changes.
    S.awaiting = null; a.res(SWITCH);
    if (a.req) add(el('p', 'm-quiet enter', `Okay, I’ve left “${a.req}” for now. Nothing was changed.`));
    setBusy(false);
  }
  if (S.busy) return;
  if (S.view !== 'chat') setView('chat');
  beginThread();
  // The request in plain words, for "Back to …" and "I’ve left … for now".
  S.aborted = false; S.req = cap(clean(text.replace(CHANGE_OF_MIND, '').replace(/\s*\binstead\b\s*/i, ' ')));
  // Only the latest request may mark the assistant as idle when it ends.
  const mine = S.sendId = (S.sendId || 0) + 1;
  add(el('div', 'm-user enter')).textContent = text;
  setBusy(true, 'Thinking…');
  try { await (flow || route(text))(text); }
  catch (err) {
    if (err === SWITCH) return;
    if (err === CANCEL) add(el('p', 'm-quiet enter', 'Okay, cancelled. Nothing was changed.'));
    else if (err === ABORT) add(el('p', 'm-quiet enter', 'Stopped. Nothing was changed.'));
    else throw err;
  }
  finally { if (!S.running && S.sendId === mine && !S.awaiting) setBusy(false); }
}

async function trace(items) {
  const box = add(el('div', 'trace enter'));
  for (const [label, res] of items) {
    const row = el('div', 'row live', `<i class="dot"></i><span class="lbl">${label}</span><span class="res"></span>`);
    box.append(row); toBottom();
    await tick(480 + Math.random() * 280);
    row.classList.replace('live', 'done'); row.querySelector('.res').textContent = '→ ' + res;
  }
  await tick(260);
  const list = box.innerHTML;
  const n = items.length;
  box.innerHTML = '';
  const btn = el('button', 'trace-sum', `<i></i>Looked at ${n} thing${n > 1 ? 's' : ''} ${icon('chevron')}`);
  btn.type = 'button'; btn.setAttribute('aria-expanded', 'false');
  const detail = el('div', 'trace', list); detail.hidden = true; detail.style.margin = '8px 0 0 4px';
  btn.addEventListener('click', () => { detail.hidden = !detail.hidden; btn.setAttribute('aria-expanded', !detail.hidden); });
  box.append(btn, detail);
}

async function say(blocks) {
  const m = add(el('div', 'm-ai enter'));
  for (const b of blocks) {
    const node = b.ul ? el('ul') : el('p'); m.append(node);
    const parts = b.ul ? b.ul : [b.p ?? b];
    for (const part of parts) {
      const target = b.ul ? node.appendChild(el('li')) : node;
      let n = 0;
      // **bold** may span several words (“**Sara Khan**”), so split on it first.
      for (const seg of part.split(/(\*\*[^*]+\*\*)/)) {
        if (!seg) continue;
        const bold = seg.startsWith('**') && seg.endsWith('**');
        const holder = bold ? target.appendChild(el('strong')) : target;
        for (const w of (bold ? seg.slice(2, -2) : seg).split(/(\s+)/)) {
          if (!w) continue;
          if (/^\s+$/.test(w)) { holder.append(w); continue; }
          const s = el('span', 'w'); s.textContent = w; holder.append(s);
          if (++n % 2 === 0) { await tick(30); }
        }
      }
      toBottom();
    }
  }
  return m;
}

/* -------------------------------------------------------------- plans */
function planCard(plan) {
  const card = el('div', 'plan enter');
  card.innerHTML = `<div class="plan-eyebrow"><i></i>Plan · ${plan.steps.length} step${plan.steps.length > 1 ? 's' : ''} · runs as you</div>
    <h3>${plan.title}</h3>
    <ol class="steps"><span class="rail"></span>${plan.steps.map((s, i) => `
      <li class="step" data-idx="${i}">
        <span class="node">${i + 1}</span>
        <div><b>${s.label}</b><div class="det">${s.detail}</div>${s.flag ? `<span class="flag">${icon('alert')}${s.flag}</span>` : ''}</div>
        <span class="st-r">Ready</span>
      </li>`).join('')}</ol>
    <div class="plan-foot"></div>`;
  plan.card = card;
  renderFoot(plan);
  return card;
}
function renderFoot(plan) {
  const f = $('.plan-foot', plan.card); const n = plan.steps.length;
  const doneN = plan.steps.filter(s => s.status === 'done').length;
  if (plan.state === 'proposed') {
    f.innerHTML = `<span class="note">${icon('shield')}Runs in order and stops at the first refusal</span>
      <button class="b-ghost" data-act="cancel">Cancel</button><button class="b-run" data-act="run">${icon('play')}Run plan</button>`;
  } else if (plan.state === 'running' || plan.state === 'stopping') {
    f.innerHTML = `<div class="progress"><i style="--p:${(doneN / n) * 100}%"></i></div>
      <span class="note">${plan.state === 'stopping' ? 'Stopping after this step…' : `Step ${Math.min(doneN + 1, n)} of ${n} · as you`}</span>
      ${plan.state === 'running' && n > 1 && doneN < n - 1 ? '<button class="b-ghost" data-act="stop">Stop after this step</button>' : ''}`;
  } else if (plan.state === 'done') {
    const where = plan.page ? (plan.page.id === 'config' ? SEC_NAMES[plan.page.sec] : PAGE_NAMES[plan.page.id]) : plan.person ? 'Users' : '';
    f.innerHTML = `<span class="note ok">${icon('check')}Done in ${(plan.ms / 1000).toFixed(1)}s · ${n} change${n > 1 ? 's' : ''}, made as you</span>
      ${where ? `<button class="link" data-act="view">View in ${where} ${icon('arrowRight')}</button>` : ''}`;
  } else if (plan.state === 'stopped') {
    f.innerHTML = `<span class="note">Stopped · ${doneN} of ${n} done, the rest skipped</span>`;
  } else if (plan.state === 'cancelled') {
    f.innerHTML = `<span class="note">Cancelled · nothing changed</span>`;
  }
  f.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'run') runPlan(plan);
    if (act === 'cancel') { plan.state = 'cancelled'; plan.card.classList.add('cancelled'); renderFoot(plan); logChange(plan); }
    if (act === 'stop') { plan.state = 'stopping'; renderFoot(plan); }
    if (act === 'view') {
      (plan.keys || []).forEach(k => FRESH.add(k));
      if (plan.page) { go(plan.page.id, plan.page.sec); return; }
      go('config', 'users'); const r = $(`.tr[data-name="${plan.person}"]`); if (r) { r.classList.remove('fresh'); void r.offsetWidth; r.classList.add('fresh'); }
    }
  };
}
function setStep(plan, i, status, summary, bad) {
  const s = plan.steps[i]; s.status = status;
  const li = $$('.step', plan.card)[i];
  li.className = `step ${status}`;
  const st = $('.st-r', li);
  st.textContent = { running: 'Running', done: `Done · ${s.secs}s`, failed: 'Refused', skipped: 'Skipped' }[status] || 'Ready';
  if (status === 'done') $('.node', li).innerHTML = icon('check');
  if (summary) { $('.flag', li)?.remove(); $('.sum', li)?.remove(); $('div', li).insertAdjacentHTML('beforeend', `<div class="sum${bad ? ' bad' : ''}">${icon(bad ? 'alert' : 'check', 'style="width:13px;height:13px"')}${summary}</div>`); }
  // The rail fills with light up to the step being worked on.
  const nodes = $$('.node', plan.card); const first = nodes[0].getBoundingClientRect().top;
  const upto = status === 'running' ? i : i + (status === 'done' ? 1 : 0);
  const to = nodes[Math.min(upto, nodes.length - 1)].getBoundingClientRect().top;
  $('.rail', plan.card).style.setProperty('--fill', `${Math.max(0, to - first)}px`);
}
async function runPlan(plan) {
  if (plan.state !== 'proposed') return;
  plan.state = 'running'; S.running = true;
  const n = plan.steps.length, t0 = performance.now();
  // Open the page the plan changes, so its rows can be seen arriving.
  if (plan.page) go(plan.page.id, plan.page.sec);
  setBusy(true, `Running step 1 of ${n}`);
  renderFoot(plan);
  for (let i = 0; i < n; i++) {
    if (plan.state === 'stopping') { for (let j = i; j < n; j++) setStep(plan, j, 'skipped'); plan.state = 'stopped'; break; }
    setStatus(`Running step ${i + 1} of ${n}`);
    setStep(plan, i, 'running'); renderFoot(plan);
    const ms = n > 2 ? 650 + Math.random() * 450 : 1300 + Math.random() * 700; await wait(ms);
    plan.steps[i].secs = (ms / 1000).toFixed(1);
    plan.steps[i].effect?.();
    setStep(plan, i, 'done', plan.steps[i].done);
    renderFoot(plan);
  }
  if (plan.state === 'running') plan.state = 'done';
  plan.ms = performance.now() - t0;
  S.running = false; setBusy(false); core.set('done');
  renderFoot(plan); logChange(plan); toBottom();
  if (plan.state === 'done' && plan.onDone) { await wait(500); plan.onDone(); }
}

/* ----------------------------------------------------------- scripts */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const EMAIL = /[\w.+-]+@[\w-]+\.[\w.]+/;
const deptNames = () => DEPTS.map(d => d[0]);
const roleNames = () => ROLE_LIST.map(r => r[0]).filter(n => n !== 'Company Admin');
const roleIn = t => roleNames().find(r => new RegExp(`\\b${r}\\b`, 'i').test(t));
const deptIn = t => deptNames().find(d => new RegExp(`\\b${d}\\b`, 'i').test(t));
const othersIn = () => PEOPLE.map(p => p[0]).filter(n => n !== P.name && n !== P.full);

/* Asking. Noma never makes names up: whatever it creates is named by the
   person. A flow asks, the conversation waits, and the next message is the answer. */
const CANCEL = Symbol('cancel');
const clean = s => String(s || '').replace(/^[\s"“'‘:,-]+|[\s"”'’.!?,]+$/g, '').replace(/\s+/g, ' ');
const nameCase = s => { s = clean(s); return s && s === s.toLowerCase() ? s.replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()) : s; };
// Commas or new lines only: "Sales and Lettings" may well be one department.
const listOf = t => t.split(/\n|,|;/).map(nameCase).filter(Boolean);
const calledIn = t => nameCase((t.match(/\b(?:called|named)\s+(.+)$/i) || [])[1] || '');
const isNo = t => /^(no|none|nope|skip|no thanks|not now|nothing)\b/i.test(clean(t));
const mgrLabel = m => m === P.name ? 'you' : m;
function defaultPlaceholder() {
  return obActive() ? `Ask anything, like “what’s a space?” or “where are ${P.admin ? 'roles' : 'my tasks'}?”` : 'Ask Noma, or type / for everything';
}
// `expects` says what kind of answer fits, so the next message can be told apart
// from a side question or a new request (see classify).
const SWITCH = Symbol('switch');
function showChoices(choices) {
  if (!choices.length) return;
  const qr = add(el('div', 'qr enter', choices.map(c => `<button type="button">${esc(c)}</button>`).join('')));
  qr.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !S.awaiting) return; $$('button', qr).forEach(x => x.disabled = true); send(b.textContent); });
}
function waitForAnswer(a) {
  S.awaiting = a;
  setBusy(false); setStatus('Waiting for your answer');
  input.placeholder = a.hint; input.focus({ preventScroll: true });
}
async function askFor(q, { hint = 'Type your answer', choices = [], expects = 'text', options = choices } = {}) {
  await say(Array.isArray(q) ? q : [q]);
  showChoices(choices);
  const answer = await new Promise(res => waitForAnswer({ res, q, hint, choices, expects, options, req: S.req }));
  input.placeholder = defaultPlaceholder();
  if (answer === SWITCH) throw SWITCH;
  if (answer == null) throw CANCEL;
  return answer;
}
const matchOption = (t, options) => { const a = clean(t).toLowerCase(); return a && (options.find(o => o.toLowerCase() === a) || options.find(o => o.toLowerCase().includes(a) || a.includes(o.toLowerCase()))); };

/* While a question is open, every message is read for what it is: the answer,
   a side question (answered, then the question is asked again), or a new
   request (the open one is left, and the new one starts). Nobody has to type "cancel". */
const COMMAND = /^(please\s+)?(invite|onboard|hire|create|make|add|give|open|schedule|switch|turn|move|change|pause|resume|approve|reject|connect|limit|set ?up|show|find|list)\b/i;
const CHANGE_OF_MIND = /^(actually|instead|wait|hold on|no,|let'?s|lets|can you|could you|i want to|i'd like to)\b/i;
function intentOf(t) {
  const s = t.toLowerCase().trim();
  if (/\b(light|white|day|dark|night|black)\b/.test(s) && /(mode|theme)/.test(s)) return 'aside';
  if (/^(where|how do i (get to|find|open)|take me to|show me where)\b/.test(s) && placeIn(t)) return 'aside';
  if (/^(what(['’]?s| is| are| does| do)|how (do|does)|explain|tell me about|difference)\b/.test(s) && LEARN.some(x => x.m.test(t))) return 'aside';
  if (OB && /\b(getting started|next step|what(['’]?s| is) next|what should i do|where (do|should) i (start|begin))\b/.test(s)) return 'aside';
  if (/^(what can (i|you)|help\b)/.test(s)) return 'aside';
  // The exact words of a suggestion, a / pick or a step button are a new request.
  if (CAPS.some(c => val(c.ask, who()) === t.trim()) || OB?.steps.some(x => x.ask === t.trim())) return 'action';
  const body = s.replace(CHANGE_OF_MIND, '').replace(/^[\s,]+/, '');
  const cap = MATCH_ORDER.map(id => CAPS.find(x => x.id === id)).find(c => c.match.test(body));
  if (cap?.answer && /\?\s*$|^(what|who|which|show|find|list)\b/.test(body)) return 'aside';
  if (COMMAND.test(body) && (cap || /\b(invite|onboard|hire|ai employee)\b/.test(body) || (obActive() && OB.steps.some(x => !x.done && x.m?.test(body))))) return 'action';
  return null;
}
function classify(t, a) {
  const s = t.trim();
  if (/^(cancel|stop|never ?mind|forget (it|that)|leave it)\b/i.test(s)) return 'cancel';
  // The kind of answer that was asked for wins first.
  if (a.expects === 'choice' && matchOption(s, a.options)) return 'answer';
  if ((a.expects === 'email' || a.expects === 'people') && EMAIL.test(s)) return 'answer';
  if (a.expects === 'number' && /\d/.test(s) && !COMMAND.test(s)) return 'answer';
  const intent = intentOf(s);
  if (intent === 'aside') return 'aside';
  // A description ("what should it do?") may start with a verb, so it takes a clearer signal to leave it.
  if (intent === 'action' && (a.expects !== 'text' || CHANGE_OF_MIND.test(s) || CAPS.some(c => val(c.ask, who()) === s))) return 'switch';
  return 'answer';
}
async function answerAside(text, a) {
  S.awaiting = null;
  add(el('div', 'm-user enter')).textContent = text;
  S.aborted = false; setBusy(true, 'Thinking…');
  try {
    await route(text)(text);
    await say([`Back to ${a.req ? `“${a.req}”` : 'my question'}: ${(Array.isArray(a.q) ? a.q : [a.q]).join(' ')}`]);
  } catch (err) { if (err !== ABORT) throw err; return; }
  showChoices(a.choices);
  waitForAnswer(a);
}
// Ask until the answer is one of the person's own departments, roles or people.
async function pickFrom(q, options, hint = 'Pick one, or type it', shown = options.slice(0, 6)) {
  for (;;) {
    const a = clean(await askFor(q, { choices: shown, hint, expects: 'choice', options })).toLowerCase();
    const hit = options.find(o => o.toLowerCase() === a) || options.find(o => o.toLowerCase().includes(a) || a.includes(o.toLowerCase()));
    if (hit) return hit;
    q = `I can’t find “${a}”. Which of these did you mean?`;
  }
}
// A list of new names, minus any that already exist.
async function askNames(q, hint, existing, kind) {
  for (;;) {
    const got = [...new Set(listOf(await askFor(q, { hint, expects: 'names' })))];
    const dup = got.filter(n => existing.some(e => e.toLowerCase() === n.toLowerCase()));
    const fresh = got.filter(n => !dup.includes(n));
    if (fresh.length) return { fresh, dup };
    q = `BlueBrick already has ${dup.join(', ')}. Which other ${kind}s should I add?`;
  }
}
async function flowNotYet(text) { await tick(300); await say([text]); offerNext(); }

/* People to invite: one per line, a name and an email, and maybe their department
   and role. Whatever is missing, Noma asks for. */
const nameFromEmail = e => e.split('@')[0].split(/[._-]/).filter(Boolean).map(cap).join(' ');
function parsePeople(t) {
  return t.split(/\n|;/).flatMap(seg => {
    const ems = seg.match(new RegExp(EMAIL.source, 'g')) || [];
    if (ems.length > 1) return ems.map(email => ({ email }));
    const email = ems[0], dept = deptIn(seg), role = roleIn(seg);
    let name = seg.replace(EMAIL, ' ');
    for (const w of [dept, role]) if (w) name = name.replace(new RegExp(`\\b${w}\\b`, 'i'), ' ');
    name = nameCase(name.replace(/\b(please|invite|onboard|add|someone|somebody|people|new|hires?|our|my|first|managers?|team|as|to|in|into|the|a|an|and|with|department|role)\b/gi, ' ').replace(/[()<>,:]/g, ' '));
    return name || email ? [{ name, email, dept, role }] : [];
  });
}
async function completePerson(p) {
  if (!p.name && p.email) p.name = nameFromEmail(p.email);
  let q = `What’s **${p.name}**’s email? The invitation goes there.`;
  while (!p.email) { p.email = ((await askFor(q, { hint: 'Their work email', expects: 'email' })).match(EMAIL) || [])[0]; q = 'That doesn’t look like an email address. What’s their email?'; }
  if (!p.dept) p.dept = await pickFrom(`Which department is **${first(p.name)}** in?`, deptNames());
  if (!p.role) p.role = await pickFrom(`Which role should **${first(p.name)}** have? It decides what they can see and do.`, roleNames());
  return p;
}
async function collectPeople(t, q, single = false) {
  let people = parsePeople(t);
  while (!people.length) people = parsePeople(await askFor(q, { hint: single ? 'Name and email' : 'Name and email, one person per line', expects: 'people' }));
  if (single) people = people.slice(0, 1);
  for (const p of people) await completePerson(p);
  return people;
}
function invitePerson(p) {
  return {
    label: `Invite ${p.name}`, detail: `${p.email} · ${p.dept} · ${p.role}`, flag: 'Sends an invitation email', done: `Invitation sent to ${p.email}`,
    effect() {
      if (PEOPLE.some(x => x[0] === p.name)) return;
      PEOPLE.unshift([p.name, p.dept, [p.role], 'invited', '—']); peopleCount++;
      const d = DEPTS.find(x => x[0] === p.dept); if (d) d[2]++;
      const r = ROLE_LIST.find(x => x[0] === p.role); if (r) r[2]++;
      FRESH.add('user:' + p.name); renderPage();
    },
  };
}
const peopleReady = () => roleNames().length && DEPTS.length;
const NOT_READY = 'Everyone you invite needs a department and a role, and BlueBrick doesn’t have those yet. Let’s set them up first.';

/* An AI employee: what it does, what it's called, where it sits and who it reports to, all from the person. */
async function collectBot(t, job) {
  job = job || clean((t.match(/\bto\s+(.+)$/i) || [])[1]) || clean(await askFor('What should it do? Describe its job in a sentence.', { hint: 'Its job, in a sentence' }));
  const name = calledIn(t) || nameCase(await askFor('What should I call it?', { hint: 'A name for your AI employee', expects: 'name' }));
  const dept = deptIn(t) || await pickFrom(`Which department does **${name}** work in?`, deptNames());
  const inDept = othersIn().filter(n => row(n)?.[1] === dept);
  const mgr = await pickFrom(`Who does **${name}** report to? They approve its work.`, ['Me', ...othersIn()], 'Pick one, or type a name', ['Me', ...(inDept.length ? inDept : othersIn()).slice(0, 5)]);
  return { name, job, dept, mgr: mgr === 'Me' ? P.name : mgr };
}
function hireStep(b) {

function route(t) {
  const s = t.toLowerCase();
  if (/\b(light|white|day)\b/.test(s) && /(mode|theme|switch|turn|make)/.test(s)) return () => flowTheme('light');
  if (/\b(dark|night|black)\b/.test(s) && /(mode|theme|switch|turn|make)/.test(s)) return () => flowTheme('dark');
  // Getting started comes first while there is any left: "create our roles" is step 1, not a new role.
  const step = obActive() && OB.steps.find(x => !x.done && x.m && x.m.test(t));
  if (step) return () => stepFlow(step);
  if (OB && /\b(set ?up|getting started|next step|what(['’]?s| is) next|where (do|should) i (start|begin)|what should i do( first)?|onboarding|first steps?)\b/.test(s)) return flowSetup;
  if (/^(where|how do i (get to|find|open)|take me to|show me where)\b/.test(s)) { const pl = placeIn(t); if (pl) return () => flowWhere(pl); }
  if (/^(what(['’]?s| is| are| does| do)|how (do|does)|explain|tell me about|difference)\b/.test(s)) { const l = LEARN.find(x => x.m.test(t)); if (l) return () => flowLearn(l); }
  for (const id of MATCH_ORDER) { const c = CAPS.find(x => x.id === id); if (c.match.test(t)) return allowed(c) ? () => flowCap(c, t) : () => flowNoAccess(c); }
  const invite = /(invite|onboard|add (a |an )?(new )?(user|person|teammate)|create (a |an )?(new )?user|new user)/.test(s);
  const hire = /(hire|bot\b|ai employee|estimator|agent)/.test(s);
  if ((invite || hire) && !P.admin) return () => flowNoAccess(CAPS.find(c => c.id === (invite ? 'invite' : 'hire')));
  if (invite && hire) return flowOnboard;
  if (invite) return flowInvite;
  if (hire) return flowHire;
  if (/(what can|help|able to|can you|what do)/.test(s)) return flowHelp;
  return flowFallback;
}
